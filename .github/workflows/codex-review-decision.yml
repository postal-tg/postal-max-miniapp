name: Codex review decision

on:
  pull_request_review:
    types:
      - submitted
  issue_comment:
    types:
      - created
      - edited
  pull_request_review_comment:
    types:
      - created
      - edited

jobs:
  codex-review-decision:
    if: >-
      (github.event_name == 'pull_request_review' &&
       (github.event.review.user.login == 'chatgpt-codex-connector[bot]' || github.event.review.user.login == 'chatgpt-codex-connector')) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       (github.event.comment.user.login == 'chatgpt-codex-connector[bot]' || github.event.comment.user.login == 'chatgpt-codex-connector')) ||
      (github.event_name == 'pull_request_review_comment' &&
       (github.event.comment.user.login == 'chatgpt-codex-connector[bot]' || github.event.comment.user.login == 'chatgpt-codex-connector'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CODEX_REVIEW_TOKEN: ${{ secrets.CODEX_REVIEW_TOKEN }}

    steps:
      - name: Verify Codex review token
        if: ${{ env.CODEX_REVIEW_TOKEN == '' }}
        run: |
          echo "::error::Set the CODEX_REVIEW_TOKEN repository secret to a GitHub token from Zonix01."
          exit 1

      - name: Approve or request changes from Codex findings
        uses: actions/github-script@v9
        with:
          github-token: ${{ env.CODEX_REVIEW_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const eventName = context.eventName;

            let pr = context.payload.pull_request || null;
            let codexReview = context.payload.review || null;
            let texts = [];
            let sourceSubmittedAt = 0;
            let sourceKind = eventName;
            let inlineReviewCommentOnly = false;

            if (eventName === 'pull_request_review') {
              if (!pr || !codexReview) {
                core.info('This event does not include a pull request review payload.');
                return;
              }

              const comments = await github.paginate(github.rest.pulls.listCommentsForReview, {
                owner,
                repo,
                pull_number: pr.number,
                review_id: codexReview.id,
                per_page: 100
              });

              texts = [codexReview.body || '', ...comments.map((comment) => comment.body || '')];
              sourceSubmittedAt = Date.parse(codexReview.submitted_at || codexReview.updated_at || codexReview.created_at || 0);
              sourceKind = 'Codex pull request review';
            } else if (eventName === 'issue_comment') {
              const issue = context.payload.issue;
              const comment = context.payload.comment;

              if (!issue || !issue.pull_request || !comment) {
                core.info('This comment is not on a pull request.');
                return;
              }

              if (!isCodexReviewComment(comment.body || '')) {
                core.info('Codex comment is not a review result, skipping.');
                return;
              }

              const response = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: issue.number
              });

              pr = response.data;
              texts = [comment.body || ''];
              sourceSubmittedAt = Date.parse(comment.updated_at || comment.created_at || 0);
              sourceKind = 'Codex issue comment';
            } else if (eventName === 'pull_request_review_comment') {
              const comment = context.payload.comment;

              if (!pr || !comment) {
                core.info('This event does not include a pull request review comment payload.');
                return;
              }

              texts = [comment.body || ''];
              sourceSubmittedAt = Date.parse(comment.updated_at || comment.created_at || 0);
              sourceKind = 'Codex inline review comment';
              inlineReviewCommentOnly = true;
            } else {
              core.info(`Unsupported event ${eventName}.`);
              return;
            }

            const { data: viewer } = await github.rest.users.getAuthenticated();
            const tokenUser = viewer.login;
            const tokenUserLower = tokenUser.toLowerCase();
            const prAuthorLower = pr.user.login.toLowerCase();
            const combinedText = texts.join('\n\n');

            const priorityPatterns = [
              /(^|\n)\s*(?:[-*]\s*)?(?:\*\*)?\[?P[0-2]\]?\s*[:\]-]/i,
              /\[(?:P0|P1|P2)(?:\s+Badge)?\]/i,
              /!\[(?:P0|P1|P2)\s+Badge\]/i,
              /img\.shields\.io\/badge\/(?:P0|P1|P2)[-/]/i,
              /\bP[0-2]\s+Badge\b/i
            ];
            const inaccessibleTaskPatterns = [
              /external\s+(?:notion\s+)?(?:task|spec|document|doc).*not accessible/i,
              /notion.*not accessible/i,
              /cannot be validated against the stated requirements/i,
              /inaccessible external spec/i,
              /cannot access (?:its|the) contents/i,
              /missing requirements/i,
              /snapshot.*(?:missing|unavailable)/i,
              /comments are unavailable/i,
              /To use Codex here.*connect to github/i,
              /РЅРµ\s+СЃРјРѕРі.*(?:РїСЂРѕС‡РёС‚Р°С‚СЊ|РїРѕР»СѓС‡РёС‚СЊ|РґРѕСЃС‚СѓРї)/i,
              /РЅРµР»СЊР·СЏ\s+РїРѕРґС‚РІРµСЂРґРёС‚СЊ/i,
              /РЅРµРґРѕСЃС‚СѓРї/i,
              /РѕС‚СЃСѓС‚СЃС‚РІ(?:СѓРµС‚|СѓСЋС‚).*С‚СЂРµР±РѕРІР°РЅ/i
            ];
            const explicitRequestChanges = /Verdict:\s*REQUEST_CHANGES/i.test(combinedText);
            const hasBlockingPriority = priorityPatterns.some((pattern) => pattern.test(combinedText));
            const hasInaccessibleTask = inaccessibleTaskPatterns.some((pattern) => pattern.test(combinedText));
            const codexRequestedChanges = codexReview && String(codexReview.state || '').toUpperCase() === 'CHANGES_REQUESTED';
            const shouldRequestChanges = explicitRequestChanges || codexRequestedChanges || hasBlockingPriority || hasInaccessibleTask;

            if (inlineReviewCommentOnly && !shouldRequestChanges) {
              core.info('Codex inline review comment does not contain P0/P1/P2 blocking markers; waiting for review summary or issue comment.');
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100
            });
            const alreadyDecided = reviews.some((review) => {
              const sameUser = review.user && review.user.login && review.user.login.toLowerCase() === tokenUserLower;
              const state = String(review.state || '').toUpperCase();
              const submittedAt = Date.parse(review.submitted_at || review.updated_at || review.created_at || 0);
              return sameUser && submittedAt >= sourceSubmittedAt && ['APPROVED', 'CHANGES_REQUESTED'].includes(state);
            });

            if (alreadyDecided) {
              core.info(`${tokenUser} already submitted a decision after this ${sourceKind}.`);
              return;
            }

            const event = shouldRequestChanges ? 'REQUEST_CHANGES' : 'APPROVE';
            const verdict = shouldRequestChanges ? 'REQUEST_CHANGES' : 'APPROVE';
            const ru = (value) => Buffer.from(value, 'base64').toString('utf8');
            const reason = hasInaccessibleTask
              ? ru('Q29kZXgg0L3QtSDRgdC80L7QsyDQv9GA0L7Rh9C40YLQsNGC0Ywg0LfQsNC00LDRh9GDINC40LvQuCDQstC90LXRiNC90Y7RjiDRgdC/0LXRhtC40YTQuNC60LDRhtC40Y4sINC/0L7RjdGC0L7QvNGDINC60L7RgNGA0LXQutGC0L3QvtGB0YLRjCBQUiDQvdC10LvRjNC30Y8g0L/QvtC00YLQstC10YDQtNC40YLRjC4=')
              : ru('Q29kZXgg0L3QsNGI0LXQuyDQt9Cw0LzQtdGH0LDQvdC40Y8g0YPRgNC+0LLQvdGPIFAwL1AxL1AyLg==');
            const body = shouldRequestChanges
              ? `Verdict: REQUEST_CHANGES\n\n${reason} ${ru('0KLRgNC10LHRg9GO0YLRgdGPINC40LfQvNC10L3QtdC90LjRjy4=')}`
              : `Verdict: APPROVE\n\n${ru('Q29kZXgg0L3QtSDQvdCw0YjQtdC7INC30LDQvNC10YfQsNC90LjQuSDRg9GA0L7QstC90Y8gUDAvUDEvUDIsINC/0L7RjdGC0L7QvNGDINGN0YLQvtGCIHB1bGwgcmVxdWVzdCDQvtC00L7QsdGA0LXQvS4=')}`;

            if (tokenUserLower === prAuthorLower) {
              await github.rest.pulls.createReview({
                owner,
                repo,
                pull_number: pr.number,
                event: 'COMMENT',
                body: `${body}\n\n${ru('R2l0SHViINC90LUg0L/QvtC30LLQvtC70Y/QtdGCIHswfSDQv9C+0YHRgtCw0LLQuNGC0YwgYXBwcm92ZSDQuNC70LggcmVxdWVzdCBjaGFuZ2VzINCyINGB0LLQvtC10LwgcHVsbCByZXF1ZXN0LCDQv9C+0Y3RgtC+0LzRgyDQstC10YDQtNC40LrRgiDQt9Cw0L/QuNGB0LDQvSDQutCw0Log0LrQvtC80LzQtdC90YLQsNGA0LjQuS4=').replace('{0}', tokenUser)}`
              });
              return;
            }

            await github.rest.pulls.createReview({
              owner,
              repo,
              pull_number: pr.number,
              event,
              body
            });

            function isCodexReviewComment(body) {
              const visible = stripDetails(body || '').trim();
              return /^Codex Review:/i.test(visible) || /^###\s*(?:[^\w\r\n]+\s*)?Codex Review/i.test(visible);
            }            function isCodexConnectorFailure(body) {
              return /To use Codex here.*connect to github/i.test(body || '');
            }



            function stripDetails(body) {
              return body.replace(/<details>[\s\S]*?<\/details>/gi, '').trim();
            }
